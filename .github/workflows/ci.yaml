name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # No toolchain is fetched: the one installed below is the one
      # every step runs with.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      # The current release, tracking patches: it satisfies go.mod's
      # floor and the pinned spec verifier's own, so neither pins the
      # other's toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # The native runner's Strong row needs unprivileged user
      # namespaces; Ubuntu 24.04 restricts them through AppArmor for
      # unconfined programs. A host without the knob has no such
      # restriction; a host with it that refuses the write fails here.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no AppArmor user-namespace restriction on this host"
          fi
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go mod tidy -diff
      - run: go build ./...
      - run: go vet ./...
      - run: GOOS=darwin go vet ./...
      - run: GOOS=windows go vet ./...
      # Every platform's command links with no C toolchain
      # (platforms.md REQ-plat-scope), before anything merges.
      - name: Cross-build every platform
        run: |
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS=${platform%/*} GOARCH=${platform#*/} go build -o /dev/null ./cmd/pb
          done
      # The runner suite runs once, below, with its live arms demanded;
      # running it here too would only double its exposure to the
      # daemon's own losses. The two unit legs share the one list.
      - run: echo "UNIT_PACKAGES=$(go list ./... | grep -v /internal/plugin/runner | tr '\n' ' ')" >> "$GITHUB_ENV"
      - run: go test -race $UNIT_PACKAGES -count=1 -timeout=30m
      # The suites pin rapid's seed for oracle determinism, which fixes
      # every property test to one trajectory. This leg restores the
      # accumulating-coverage role: a per-run seed (the run id, so any
      # failure is replayable and a re-run walks the same examples)
      # explores fresh examples with every new run. The seed and the
      # check count travel as rapid's environment defaults, which only
      # a binary linking rapid reads, so a package without property
      # tests is not handed a flag it does not define. The runner
      # suite's properties vary the same way in its live leg below.
      - name: Property tests, varying seed
        run: go test $UNIT_PACKAGES -count=1 -timeout=30m
        env:
          RAPID_SEED: ${{ github.run_id }}
          RAPID_CHECKS: "500"
      # The runner suite's live arms — the Strong row, the cgroups bound
      # accounting the sandbox places a run under only inside a delegated
      # cgroup subtree, and the docker runner against the daemon the
      # runner image carries — are demanded: a host that cannot deliver
      # the row or delegate, or whose daemon does not answer, fails this
      # leg instead of letting the arms skip.
      - name: Live runner arms under a delegated scope, against the daemon
        run: systemd-run --user --scope -q -p Delegate=yes env PB_TEST_REQUIRE_SANDBOX=1 PB_TEST_REQUIRE_CGROUPS=1 PB_TEST_REQUIRE_DOCKER=1 RAPID_SEED=${{ github.run_id }} go test ./internal/plugin/runner/ -count=1 -timeout=30m
      # The spec corpus against the tree: every requirement's witnesses
      # executed, the live ones included — the runner suite's bound
      # witnesses run a second time here, the whole suite having run
      # above (its unbound tests are the leg's alone); the memory
      # arm's exposure to the daemon's own record loss doubles with
      # it, from about one job in three thousand to one in fifteen
      # hundred at the worst measured rate, which is accepted.
      - name: Spec verification
        run: systemd-run --user --scope -q -p Delegate=yes env PB_TEST_REQUIRE_SANDBOX=1 PB_TEST_REQUIRE_CGROUPS=1 PB_TEST_REQUIRE_DOCKER=1 go run github.com/greatliontech/stipulator/cmd/stipulator@v0.64.11 check
      # The native runner's OS row is reached only where user
      # namespaces are refused, which no floor can ask for: the
      # AppArmor knob is closed again and the row's arm demanded — a
      # host that then reaches any other row fails the leg. A host
      # without the knob cannot close them, and says so by failing.
      - name: Refuse unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
      - name: The OS row's arm under a delegated scope
        run: systemd-run --user --scope -q -p Delegate=yes env PB_TEST_REQUIRE_OS_ROW=1 go test ./internal/plugin/runner/ -run '^TestRunOnOSRow$' -count=1 -timeout=10m

  # The portable half of the suite on the other operating systems
  # (platforms.md REQ-plat-scope): what a contract states for darwin or
  # windows is witnessed there. The runner suite's live arms, the race
  # leg and the spec verification are Linux's.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
        shell: bash
      - run: go build ./...
      - run: go vet ./...
      - name: The suite but the runner's
        run: go test $(go list ./... | grep -v /internal/plugin/runner) -count=1 -timeout=30m
        shell: bash
