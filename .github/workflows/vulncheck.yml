name: vulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Two of the organization's modules are private (see ci.yaml).
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GLT_RELEASER_APP_ID }}
          private-key: ${{ secrets.GLT_RELEASER_APP_KEY }}
          owner: greatliontech
      - run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        env:
          GOTOOLCHAIN: local
          GOPRIVATE: github.com/greatliontech/sandbox,github.com/greatliontech/gitprov
