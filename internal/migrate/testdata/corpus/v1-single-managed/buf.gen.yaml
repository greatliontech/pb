version: v1
managed:
  enabled: true
  go_package_prefix:
    default: example.com/acme/core/gen/go
    except:
      - buf.build/googleapis/googleapis
    override:
      buf.build/acme/core: example.com/acme/core/gen/go/core
  java_multiple_files: true
  optimize_for: SPEED
plugins:
  - name: go
    out: gen/go
    opt: paths=source_relative
  - plugin: buf.build/protocolbuffers/go:v1.35.2
    out: gen/remote
