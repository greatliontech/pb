celEnv: 1
functions:
  - name: fileNoDelete
    params:
      - name: new
        type: google.protobuf.FileDescriptorProto
    returns: bool
    cel: new != null
  - name: packageNoDelete
    params:
      - name: newPackage
        type: dyn
    returns: bool
    cel: newPackage != null
  - name: messageNoDelete
    params:
      - name: old
        type: google.protobuf.DescriptorProto
      - name: new
        type: google.protobuf.DescriptorProto
    returns: bool
    cel: old == null || (new != null && file(old).name == file(new).name)
  - name: packageMessageNoDelete
    params:
      - name: new
        type: google.protobuf.DescriptorProto
    returns: bool
    cel: new != null
  - name: enumNoDelete
    params:
      - name: old
        type: google.protobuf.EnumDescriptorProto
      - name: new
        type: google.protobuf.EnumDescriptorProto
    returns: bool
    cel: old == null || (new != null && file(old).name == file(new).name)
  - name: packageEnumNoDelete
    params:
      - name: new
        type: google.protobuf.EnumDescriptorProto
    returns: bool
    cel: new != null
  - name: serviceNoDelete
    params:
      - name: old
        type: google.protobuf.ServiceDescriptorProto
      - name: new
        type: google.protobuf.ServiceDescriptorProto
    returns: bool
    cel: old == null || (new != null && file(old).name == file(new).name)
  - name: packageServiceNoDelete
    params:
      - name: new
        type: google.protobuf.ServiceDescriptorProto
    returns: bool
    cel: new != null
  - name: extensionNoDelete
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
