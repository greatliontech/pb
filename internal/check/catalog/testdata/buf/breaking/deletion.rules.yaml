        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: old == null || (new != null && file(old).name == file(new).name)
  - name: packageExtensionNoDelete
    params:
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: new != null
  - name: rpcNoDelete
    params:
      - name: old
        type: google.protobuf.MethodDescriptorProto
      - name: new
        type: google.protobuf.MethodDescriptorProto
    returns: bool
    cel: new != null || resolve(fullName(parent(old))) == null
  - name: oneofNoDelete
    params:
      - name: new
        type: google.protobuf.OneofDescriptorProto
    returns: bool
    cel: new != null
  - name: enumValueNoDelete
    params:
      - name: old
        type: google.protobuf.EnumValueDescriptorProto
      - name: new
        type: google.protobuf.EnumValueDescriptorProto
    returns: bool
    cel: new != null || resolve(fullName(parent(old))) == null
  - name: enumValueNoDeleteUnlessNumberReserved
    params:
      - name: old
        type: google.protobuf.EnumValueDescriptorProto
      - name: new
        type: google.protobuf.EnumValueDescriptorProto
    returns: bool
    cel: >-
      new != null || resolve(fullName(parent(old))) == null ||
      resolve(fullName(parent(old))).reserved_range.exists(r, r.start <=
      old.number && old.number <= r.end)
  - name: enumValueNoDeleteUnlessNameReserved
    params:
      - name: old
        type: google.protobuf.EnumValueDescriptorProto
      - name: new
        type: google.protobuf.EnumValueDescriptorProto
    returns: bool
    cel: |-
      new != null || resolve(fullName(parent(old))) == null || (resolve(fullName(parent(old))).reserved_range.exists(r, r.start <= old.number && old.number <= r.end)
          && old.name in resolve(fullName(parent(old))).reserved_name)
  - name: fieldNoDelete
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: new != null || resolve(fullName(parent(old))) == null
  - name: fieldNoDeleteUnlessNumberReserved
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: >-
      new != null || resolve(fullName(parent(old))) == null ||
      resolve(fullName(parent(old))).reserved_range.exists(r, r.start <=
      old.number && old.number < r.end)
  - name: fieldNoDeleteUnlessNameReserved
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: |-
      new != null || resolve(fullName(parent(old))) == null || (resolve(fullName(parent(old))).reserved_range.exists(r, r.start <= old.number && old.number < r.end)
          && old.name in resolve(fullName(parent(old))).reserved_name)
  - name: reservedMessageNoDelete
    params:
      - name: old
        type: google.protobuf.DescriptorProto
      - name: new
        type: google.protobuf.DescriptorProto
    returns: bool
    cel: |-
      old == null || new == null || (old.reserved_range.all(r, new.reserved_range.exists(n, n.start <= r.start && r.end <= n.end))
          && old.reserved_name.all(n, n in new.reserved_name))
  - name: reservedEnumNoDelete
    params:
      - name: old
        type: google.protobuf.EnumDescriptorProto
      - name: new
        type: google.protobuf.EnumDescriptorProto
    returns: bool
    cel: |-
      old == null || new == null || (old.reserved_range.all(r, new.reserved_range.exists(n, n.start <= r.start && r.end <= n.end))
          && old.reserved_name.all(n, n in new.reserved_name))
  - name: extensionMessageNoDelete
    params:
      - name: old
        type: google.protobuf.DescriptorProto
      - name: new
        type: google.protobuf.DescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || old.extension_range.all(r,
      new.extension_range.exists(n, n.start <= r.start && r.end <= n.end))
