          [google.protobuf.FieldDescriptorProto.Type.TYPE_FIXED32, google.protobuf.FieldDescriptorProto.Type.TYPE_SFIXED32],
          [google.protobuf.FieldDescriptorProto.Type.TYPE_FIXED64, google.protobuf.FieldDescriptorProto.Type.TYPE_SFIXED64]]
         .exists(g, old.type in g && new.type in g)
      || (old.type == google.protobuf.FieldDescriptorProto.Type.TYPE_ENUM && new.type == google.protobuf.FieldDescriptorProto.Type.TYPE_ENUM
          && resolve(new.type_name) != null
          && enums(visible(file(old))).exists(e, '.' + fullName(e) == old.type_name
               && e.name == resolve(new.type_name).name
               && e.value.all(v, resolve(new.type_name).value.exists(w, w.name == v.name && w.number == v.number))))
  - name: fieldSameOneof
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: |-
      old == null || new == null || ((has(old.oneof_index) && !old.proto3_optional) == (has(new.oneof_index) && !new.proto3_optional)
          && (!(has(old.oneof_index) && !old.proto3_optional)
              || parent(old).oneof_decl[old.oneof_index].name == parent(new).oneof_decl[new.oneof_index].name))
  - name: fieldSameDefault
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
