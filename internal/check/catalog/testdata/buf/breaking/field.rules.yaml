celEnv: 1
functions:
  - name: fieldSameName
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: old == null || new == null || old.name == new.name
  - name: fieldSameJsonName
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: old == null || new == null || old.json_name == new.json_name
  - name: fieldSameType
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || (old.type == new.type && old.type_name ==
      new.type_name)
  - name: fieldSameLabel
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: old == null || new == null || old.label == new.label
  - name: fieldSameCardinality
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: |-
      old == null || new == null || (old.label == new.label
          && features(old).field_presence == features(new).field_presence
          && parent(old).nested_type.exists(n, has(n.options) && n.options.map_entry && old.type_name == '.' + fullName(parent(old)) + '.' + n.name)
             == parent(new).nested_type.exists(n, has(n.options) && n.options.map_entry && new.type_name == '.' + fullName(parent(new)) + '.' + n.name))
  - name: fieldWireCompatibleCardinality
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: |-
      old == null || new == null || (old.label == new.label
          && (features(old).field_presence == google.protobuf.FeatureSet.FieldPresence.LEGACY_REQUIRED)
             == (features(new).field_presence == google.protobuf.FeatureSet.FieldPresence.LEGACY_REQUIRED))
  - name: fieldWireJsonCompatibleCardinality
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: |-
      old == null || new == null || (old.label == new.label
          && (features(old).field_presence == google.protobuf.FeatureSet.FieldPresence.LEGACY_REQUIRED)
             == (features(new).field_presence == google.protobuf.FeatureSet.FieldPresence.LEGACY_REQUIRED)
          && parent(old).nested_type.exists(n, has(n.options) && n.options.map_entry && old.type_name == '.' + fullName(parent(old)) + '.' + n.name)
             == parent(new).nested_type.exists(n, has(n.options) && n.options.map_entry && new.type_name == '.' + fullName(parent(new)) + '.' + n.name))
  - name: fieldWireCompatibleType
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: |-
      old == null || new == null || (old.type == new.type && old.type_name == new.type_name) || [[google.protobuf.FieldDescriptorProto.Type.TYPE_INT32, google.protobuf.FieldDescriptorProto.Type.TYPE_UINT32, google.protobuf.FieldDescriptorProto.Type.TYPE_INT64, google.protobuf.FieldDescriptorProto.Type.TYPE_UINT64, google.protobuf.FieldDescriptorProto.Type.TYPE_BOOL],
          [google.protobuf.FieldDescriptorProto.Type.TYPE_SINT32, google.protobuf.FieldDescriptorProto.Type.TYPE_SINT64],
          [google.protobuf.FieldDescriptorProto.Type.TYPE_FIXED32, google.protobuf.FieldDescriptorProto.Type.TYPE_SFIXED32],
          [google.protobuf.FieldDescriptorProto.Type.TYPE_FIXED64, google.protobuf.FieldDescriptorProto.Type.TYPE_SFIXED64]]
         .exists(g, old.type in g && new.type in g)
      || (old.type == google.protobuf.FieldDescriptorProto.Type.TYPE_STRING && new.type == google.protobuf.FieldDescriptorProto.Type.TYPE_BYTES) || (old.type == google.protobuf.FieldDescriptorProto.Type.TYPE_ENUM && new.type == google.protobuf.FieldDescriptorProto.Type.TYPE_ENUM
          && resolve(new.type_name) != null
          && enums(visible(file(old))).exists(e, '.' + fullName(e) == old.type_name
               && e.name == resolve(new.type_name).name
               && e.value.all(v, resolve(new.type_name).value.exists(w, w.name == v.name && w.number == v.number))))
  - name: fieldWireJsonCompatibleType
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: |-
      old == null || new == null || (old.type == new.type && old.type_name == new.type_name) || [[google.protobuf.FieldDescriptorProto.Type.TYPE_INT32, google.protobuf.FieldDescriptorProto.Type.TYPE_UINT32],
