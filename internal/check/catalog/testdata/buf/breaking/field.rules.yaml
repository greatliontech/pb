      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || (has(options(old).jstype) ==
      has(options(new).jstype) && (!has(options(old).jstype) ||
      options(old).jstype == options(new).jstype))
  - name: fieldSameCtype
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || (has(options(old).ctype) ==
      has(options(new).ctype) && (!has(options(old).ctype) || options(old).ctype
      == options(new).ctype))
  - name: fieldSameCppStringType
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: |-
      old == null || new == null || !(old.type in [google.protobuf.FieldDescriptorProto.Type.TYPE_STRING, google.protobuf.FieldDescriptorProto.Type.TYPE_BYTES]) || !(new.type in [google.protobuf.FieldDescriptorProto.Type.TYPE_STRING, google.protobuf.FieldDescriptorProto.Type.TYPE_BYTES]) || cel.bind(o, has(options(old).ctype) && options(old).ctype == 'CORD' ? pb.CppFeatures.StringType.CORD : proto.getExt(features(old), pb.cpp).string_type,
         cel.bind(n, has(options(new).ctype) && options(new).ctype == 'CORD' ? pb.CppFeatures.StringType.CORD : proto.getExt(features(new), pb.cpp).string_type,
         o == n))
  - name: fieldSameUtf8Validation
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || old.type !=
      google.protobuf.FieldDescriptorProto.Type.TYPE_STRING || new.type !=
      google.protobuf.FieldDescriptorProto.Type.TYPE_STRING ||
      features(old).utf8_validation == features(new).utf8_validation
  - name: fieldSameJavaUtf8Validation
    params:
      - name: old
        type: google.protobuf.FieldDescriptorProto
      - name: new
        type: google.protobuf.FieldDescriptorProto
    returns: bool
    cel: |-
      old == null || new == null || old.type != google.protobuf.FieldDescriptorProto.Type.TYPE_STRING || new.type != google.protobuf.FieldDescriptorProto.Type.TYPE_STRING || cel.bind(o, has(options(file(old)).java_string_check_utf8) && options(file(old)).java_string_check_utf8
                    ? pb.JavaFeatures.Utf8Validation.VERIFY : proto.getExt(features(old), pb.java).utf8_validation,
         cel.bind(n, has(options(file(new)).java_string_check_utf8) && options(file(new)).java_string_check_utf8
                    ? pb.JavaFeatures.Utf8Validation.VERIFY : proto.getExt(features(new), pb.java).utf8_validation,
         o == n))
  - name: fileSameJavaStringCheckUtf8
    params:
      - name: old
        type: google.protobuf.FileDescriptorProto
      - name: new
        type: google.protobuf.FileDescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || (has(options(old).java_string_check_utf8) ==
      has(options(new).java_string_check_utf8) &&
      (!has(options(old).java_string_check_utf8) ||
      options(old).java_string_check_utf8 == options(new).java_string_check_utf8))
