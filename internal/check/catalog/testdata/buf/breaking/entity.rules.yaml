celEnv: 1
functions:
  - name: enumValueSameName
    params:
      - name: old
        type: google.protobuf.EnumValueDescriptorProto
      - name: new
        type: google.protobuf.EnumValueDescriptorProto
    returns: bool
    cel: old == null || new == null || old.name == new.name
  - name: enumSameType
    params:
      - name: old
        type: google.protobuf.EnumDescriptorProto
      - name: new
        type: google.protobuf.EnumDescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || features(old).enum_type ==
      features(new).enum_type
  - name: enumSameJsonFormat
    params:
      - name: old
        type: google.protobuf.EnumDescriptorProto
      - name: new
        type: google.protobuf.EnumDescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || features(old).json_format ==
      features(new).json_format
  - name: messageSameJsonFormat
    params:
      - name: old
        type: google.protobuf.DescriptorProto
      - name: new
        type: google.protobuf.DescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || features(old).json_format ==
      features(new).json_format
  - name: messageSameMessageSetWireFormat
    params:
      - name: old
        type: google.protobuf.DescriptorProto
      - name: new
        type: google.protobuf.DescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || (has(options(old).message_set_wire_format) ==
      has(options(new).message_set_wire_format) &&
      (!has(options(old).message_set_wire_format) ||
      options(old).message_set_wire_format ==
      options(new).message_set_wire_format))
  - name: messageNoRemoveStandardDescriptorAccessor
    params:
      - name: old
        type: google.protobuf.DescriptorProto
      - name: new
        type: google.protobuf.DescriptorProto
    returns: bool
    cel: >-
      old == null || new == null ||
      !(has(options(new).no_standard_descriptor_accessor) &&
      options(new).no_standard_descriptor_accessor) ||
      (has(options(old).no_standard_descriptor_accessor) &&
      options(old).no_standard_descriptor_accessor)
  - name: messageSameRequiredFields
    params:
      - name: old
        type: google.protobuf.DescriptorProto
      - name: new
        type: google.protobuf.DescriptorProto
    returns: bool
    cel: |-
      old == null || new == null || old.field.filter(f, features(f).field_presence == google.protobuf.FeatureSet.FieldPresence.LEGACY_REQUIRED).map(f, f.number).sort()
         == new.field.filter(f, features(f).field_presence == google.protobuf.FeatureSet.FieldPresence.LEGACY_REQUIRED).map(f, f.number).sort()
  - name: rpcSameRequestType
    params:
      - name: old
        type: google.protobuf.MethodDescriptorProto
      - name: new
        type: google.protobuf.MethodDescriptorProto
    returns: bool
    cel: old == null || new == null || old.input_type == new.input_type
  - name: rpcSameResponseType
    params:
      - name: old
        type: google.protobuf.MethodDescriptorProto
      - name: new
        type: google.protobuf.MethodDescriptorProto
    returns: bool
    cel: old == null || new == null || old.output_type == new.output_type
  - name: rpcSameClientStreaming
    params:
      - name: old
        type: google.protobuf.MethodDescriptorProto
      - name: new
        type: google.protobuf.MethodDescriptorProto
    returns: bool
    cel: old == null || new == null || old.client_streaming == new.client_streaming
  - name: rpcSameServerStreaming
    params:
      - name: old
        type: google.protobuf.MethodDescriptorProto
      - name: new
        type: google.protobuf.MethodDescriptorProto
    returns: bool
    cel: old == null || new == null || old.server_streaming == new.server_streaming
  - name: rpcSameIdempotencyLevel
    params:
      - name: old
        type: google.protobuf.MethodDescriptorProto
      - name: new
        type: google.protobuf.MethodDescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || (has(options(old).idempotency_level) ==
      has(options(new).idempotency_level) && (!has(options(old).idempotency_level)
      || options(old).idempotency_level == options(new).idempotency_level))
rules:
  - id: ENUM_VALUE_SAME_NAME
    kind: breaking
    target: enum-value
    severity: error
    tags: [FILE, PACKAGE, WIRE_JSON]
    cel: enumValueSameName(old, new)
    message: an enum value's name changed
  - id: ENUM_VALUE_SAME_NAME_STABLE
    kind: breaking
    target: enum-value
    severity: error
    tags: [FILE_STABLE, PACKAGE_STABLE, WIRE_JSON_STABLE]
    cel: >-
      (oldFile != null && unstablePackage(oldFile.package)) || (newFile != null && unstablePackage(newFile.package)) ||
      enumValueSameName(old, new)
    message: an enum value's name changed
  - id: ENUM_SAME_TYPE
    kind: breaking
    target: enum
    severity: error
    tags: [FILE, PACKAGE]
    cel: enumSameType(old, new)
    message: an enum changed between open and closed
