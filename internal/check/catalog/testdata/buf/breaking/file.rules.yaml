celEnv: 1
functions:
  - name: unstablePackage
    params:
      - name: pkg
        type: string
    returns: bool
    cel: pkg.matches('\\.v0*[1-9][0-9]*(test[^.]*|(p0*[1-9][0-9]*)?(alpha|beta)(0*[1-9][0-9]*)?)$')
  - name: fileSamePackage
    params:
      - name: old
        type: google.protobuf.FileDescriptorProto
      - name: new
        type: google.protobuf.FileDescriptorProto
    returns: bool
    cel: old == null || new == null || old.package == new.package
  - name: fileSameSyntax
    params:
      - name: old
        type: google.protobuf.FileDescriptorProto
      - name: new
        type: google.protobuf.FileDescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || ((old.syntax == '' ? 'proto2' : old.syntax) ==
      (new.syntax == '' ? 'proto2' : new.syntax) && old.edition == new.edition)
  - name: fileSameCcEnableArenas
    params:
      - name: old
        type: google.protobuf.FileDescriptorProto
      - name: new
        type: google.protobuf.FileDescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || (has(options(old).cc_enable_arenas) ==
      has(options(new).cc_enable_arenas) && (!has(options(old).cc_enable_arenas)
      || options(old).cc_enable_arenas == options(new).cc_enable_arenas))
  - name: fileSameCcGenericServices
    params:
      - name: old
        type: google.protobuf.FileDescriptorProto
      - name: new
        type: google.protobuf.FileDescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || (has(options(old).cc_generic_services) ==
      has(options(new).cc_generic_services) &&
      (!has(options(old).cc_generic_services) || options(old).cc_generic_services
      == options(new).cc_generic_services))
  - name: fileSameCsharpNamespace
    params:
      - name: old
        type: google.protobuf.FileDescriptorProto
      - name: new
        type: google.protobuf.FileDescriptorProto
    returns: bool
    cel: >-
      old == null || new == null || (has(options(old).csharp_namespace) ==
      has(options(new).csharp_namespace) && (!has(options(old).csharp_namespace)
      || options(old).csharp_namespace == options(new).csharp_namespace))
  - name: fileSameGoPackage
    params:
      - name: old
        type: google.protobuf.FileDescriptorProto
      - name: new
        type: google.protobuf.FileDescriptorProto
    returns: bool
    cel: >-
