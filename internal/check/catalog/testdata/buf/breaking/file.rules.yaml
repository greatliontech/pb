rules:
  - id: FILE_SAME_PACKAGE
    kind: breaking
    target: file
    severity: error
    tags: [FILE, PACKAGE, WIRE_JSON, WIRE]
    cel: fileSamePackage(old, new)
    message: a file's package changed
  - id: FILE_SAME_PACKAGE_STABLE
    kind: breaking
    target: file
    severity: error
    tags: [FILE_STABLE, PACKAGE_STABLE, WIRE_JSON_STABLE, WIRE_STABLE]
    cel: >-
      (old != null && unstablePackage(old.package)) || (new != null && unstablePackage(new.package)) || fileSamePackage(old,
      new)
    message: a file's package changed
  - id: FILE_SAME_SYNTAX
    kind: breaking
    target: file
    severity: error
    tags: [FILE, PACKAGE]
    cel: fileSameSyntax(old, new)
