celEnv: 1
rules:
  - id: FILE_SAME_PACKAGE
    kind: breaking
    target: file
    severity: error
    tags: [FILE, PACKAGE, WIRE_JSON, WIRE]
    cel: old == null || new == null || old.package == new.package
    message: a file's package changed
  - id: FILE_SAME_SYNTAX
    kind: breaking
    target: file
    severity: error
    tags: [FILE, PACKAGE]
    cel: >-
      old == null || new == null
      || ((old.syntax == '' ? 'proto2' : old.syntax) == (new.syntax == '' ? 'proto2' : new.syntax) && old.edition == new.edition)
    message: a file's syntax changed
  - id: FILE_SAME_CC_ENABLE_ARENAS
    kind: breaking
    target: file
    severity: error
    tags: [FILE, PACKAGE]
    cel: old == null || new == null || (has(options(old).cc_enable_arenas) == has(options(new).cc_enable_arenas) && (!has(options(old).cc_enable_arenas) || options(old).cc_enable_arenas == options(new).cc_enable_arenas))
    message: a file's cc_enable_arenas changed
